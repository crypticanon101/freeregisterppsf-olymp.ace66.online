        function handleResize() {
            var imageCount = contactContents.length;
            var img = contactContents[0].querySelector('img');
            var imageComputedStyle = window.getComputedStyle(img);
            var imageHeight = parseFloat(imageComputedStyle.width) + 8;

        window.addEventListener("resize", handleResize);
